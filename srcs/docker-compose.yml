services:
  mariadb:
    container_name: mariadb
    build: ./requirements/mariadb
    env_file: ../.env
    networks:
      - inception
    volumes:
      - mariadb:/var/lib/mysql
    ports:
      - "3306:3306"
    restart: on-failure
  
  wordpress:
    container_name: wordpress
    build: ./requirements/wordpress
    networks:
      - inception
    volumes:
      - wordpress:/var/www/html
    ports:
      - "9000:9000"
    depends_on:
      - mariadb
    restart: on-failure

  nginx:
    container_name: nginx
    build: ./requirements/nginx
    networks:
      - inception
    volumes:
      - wordpress:/var/www/html
    ports:
      - "443:443"
    depends_on:
      - wordpress
    restart: on-failure

networks:
  inception:
    driver: bridge


volumes:
  wordpress:
  mariadb: