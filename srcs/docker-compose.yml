services:
  mariadb:
    container_name: mariadb
    build: ./requirements/mariadb
    env_file: ../.env
    networks:
      - inception
    volumes:
      - mariadb:/var/lib/mysql
    ports:
      - "3306:3306"
    restart: on-failure
  
  wordpress:
    container_name: wordpress
    build: ./requirements/wordpress
    env_file: ../.env
    networks:
      - inception
    volumes:
      - wordpress:/var/www/html
    ports:
      - "9000:9000"
    depends_on:
      - mariadb
    restart: on-failure

  nginx:
    container_name: nginx
    build: ./requirements/nginx
    env_file: ../.env
    networks:
      - inception
    volumes:
      - wordpress:/var/www/html
    ports:
      - "443:443"
    depends_on:
      - wordpress
      - redis
    restart: on-failure

# BONUS
  redis:
    container_name: redis
    build: ./requirements/bonus/redis
    networks:
      - inception
    restart: on-failure

  ftp:
    container_name: ftp
    build: ./requirements/bonus/ftp
    env_file: ../.env
    networks:
      - inception
    volumes:
      - wordpress:/var/www/html
    ports:
      - "21:21"
      - "21000-21010:21000-21010"
    restart: on-failure

  static:
    container_name: static
    build: ./requirements/bonus/static
    networks:
      - inception
    ports:
      - "8080:80"
    restart: on-failure

  adminer:
    container_name: adminer
    build: ./requirements/bonus/adminer
    networks:
      - inception
    ports:
      - "8081:8080"
    depends_on:
      - mariadb
    restart: on-failure

  portainer:
    container_name: portainer
    build: ./requirements/bonus/portainer
    networks:
      - inception
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer:/data
    ports:
      - "9443:9443"
    restart: on-failure


networks:
  inception:
    driver: bridge


volumes:
  wordpress:
    driver_opts:
      type: none
      o: bind
      device: /home/edi-maio/data/wordpress
  mariadb:
    driver_opts:
      type: none
      o: bind
      device: /home/edi-maio/data/mariadb
  portainer:
    driver_opts:
      type: none
      o: bind
      device: /home/edi-maio/data/portainer